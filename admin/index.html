<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCB Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bordeaux:#421D1D;--gold:#F0B66B;--deep-gold:#B8853E;--near-black:#1A1A1A;--muted:#7A6E64}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:var(--near-black);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top right,rgba(66,29,29,.4),transparent 60%),radial-gradient(ellipse at bottom left,rgba(240,182,107,.06),transparent 70%);pointer-events:none}
    .card{background:#FFF;color:var(--near-black);padding:48px 44px;border-radius:16px;max-width:420px;width:100%;box-shadow:0 24px 48px rgba(0,0,0,.3);position:relative;z-index:2;text-align:center}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),#F5D6A8,var(--gold));border-radius:16px 16px 0 0}
    .brand{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--deep-gold);text-transform:uppercase;margin-bottom:12px}
    h1{font-size:26px;font-weight:800;color:var(--near-black);letter-spacing:-.5px;margin-bottom:10px}
    .sub{font-size:13.5px;color:var(--muted);margin-bottom:32px;line-height:1.55}
    .btn{display:inline-block;width:100%;padding:14px;background:var(--bordeaux);color:var(--gold);border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:all .25s;text-decoration:none}
    .btn:hover{background:var(--near-black)}
  </style>
</head>
<body>

<div class="card">
  <div class="brand">UCB Repetitorium</div>
  <h1>Admin-Bereich</h1>
  <p class="sub">Hier verwaltest du Buchungen und Anfragen.</p>
  <a href="/dashboard.html" class="btn">Dashboard öffnen →</a>
</div>

</body>
</html>
