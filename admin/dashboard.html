<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCB Admin · Dashboard</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face{
      font-family:'Pilat Wide';
      src:url('/assets/fonts/Pilat_Wide_Bold.otf') format('opentype');
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }
    :root {
      --bordeaux:#421D1D;
      --gold:#F0B66B;
      --deep-gold:#B8853E;
      --shell:#F8F4EE;
      --near-black:#1A1A1A;
      --muted:#7A6E64;
      --border:#E5DDD0;
      --green:#16A34A;
      --orange:#EA580C;
      --red:#DC2626;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:var(--shell);color:var(--near-black);font-size:14px}
    
    /* Topbar */
    .topbar{background:var(--near-black);color:#fff;padding:12px 0;border-bottom:3px solid var(--gold)}
    .topbar-inner{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
    .brand img{height:32px;width:auto;display:block}
    .brand-text{font-family:'Pilat Wide','Manrope',sans-serif;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;line-height:1}
    .brand-subtext{font-family:'Manrope',sans-serif;font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
    .topbar-right{display:flex;align-items:center;gap:14px;font-size:12px;color:rgba(255,255,255,.7)}
    .logout-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block}
    .logout-btn:hover{background:rgba(255,255,255,.1);color:#fff}
    
    /* Tabs */
    .tabs-wrap{background:#fff;border-bottom:1px solid var(--border)}
    .tabs{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;gap:8px}
    .tab{padding:14px 18px;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:8px}
    .tab:hover{color:var(--near-black)}
    .tab.active{color:var(--bordeaux);border-bottom-color:var(--bordeaux)}
    .tab-count{background:var(--shell);color:var(--near-black);padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:700}
    .tab.active .tab-count{background:var(--gold);color:var(--bordeaux)}
    
    /* Main */
    .main{max-width:1280px;margin:0 auto;padding:24px}
    
    /* Stats */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px}
    .stat-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--deep-gold);margin-bottom:6px}
    .stat-value{font-size:24px;font-weight:800;color:var(--near-black);letter-spacing:-.01em}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:2px}
    
    /* Table */
    .table-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .table-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
    .table-title{font-size:13px;font-weight:700;color:var(--near-black);text-transform:uppercase;letter-spacing:.05em}
    .table-search{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;outline:none;width:240px}
    .table-search:focus{border-color:var(--bordeaux)}
    
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:11px 20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--shell);border-bottom:1px solid var(--border)}
    td{padding:14px 20px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#FAFAF8}
    
    .name{font-weight:700;color:var(--near-black)}
    .meta{font-size:11.5px;color:var(--muted);margin-top:1px}
    .email{color:var(--bordeaux);text-decoration:none;font-size:12.5px}
    .email:hover{text-decoration:underline}
    
    .status{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .status::before{content:'';width:5px;height:5px;border-radius:50%}
    .status-paid{background:rgba(22,163,74,.1);color:var(--green)}
    .status-paid::before{background:var(--green)}
    .status-pending{background:rgba(234,88,12,.1);color:var(--orange)}
    .status-pending::before{background:var(--orange)}
    .status-new{background:rgba(240,182,107,.15);color:var(--deep-gold)}
    .status-new::before{background:var(--gold)}
    .status-contacted{background:rgba(66,29,29,.08);color:var(--bordeaux)}
    .status-contacted::before{background:var(--bordeaux)}
    .status-expired{background:rgba(220,38,38,.08);color:var(--red)}
    .status-expired::before{background:var(--red)}
    .status-unpaid{background:rgba(220,38,38,.08);color:var(--red)}
    .status-unpaid::before{background:var(--red)}
    .status-refunded{background:rgba(122,110,100,.12);color:var(--muted)}
    .status-refunded::before{background:var(--muted)}
    .status-booked{background:rgba(22,163,74,.1);color:var(--green)}
    .status-booked::before{background:var(--green)}
    .status-closed{background:rgba(122,110,100,.12);color:var(--muted)}
    .status-closed::before{background:var(--muted)}
    
    .actions{display:flex;gap:6px}
    .action-btn{padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:5px;font-size:11px;font-weight:600;color:var(--near-black);cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
    .action-btn:hover{background:var(--bordeaux);color:var(--gold);border-color:var(--bordeaux)}
    
    /* Hidden by default */
    .tab-content{display:none}
    .tab-content.active{display:block}
    
    .empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px}
    
    /* Clickable rows */
    .clickable-row{cursor:pointer;transition:background .15s}
    .clickable-row:hover td{background:#FAFAF8}
    
    /* Detail Modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,26,26,.75);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
    .modal-overlay.show{display:flex}
    .modal{background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.4);position:relative;animation:modalIn .3s cubic-bezier(.2,.8,.2,1)}
    @keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    .modal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),#F5D6A8,var(--gold));border-radius:14px 14px 0 0}
    
    .modal-header{padding:28px 32px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
    .modal-title-block{flex:1;min-width:0}
    .modal-pre{font-family:'Playfair Display',serif;font-style:italic;font-size:12px;color:var(--deep-gold);margin-bottom:4px}
    .modal-title{font-family:'Pilat Wide','Manrope',sans-serif;font-size:22px;font-weight:700;color:var(--near-black);text-transform:uppercase;letter-spacing:.005em;line-height:1.15;margin-bottom:6px}
    .modal-sub{font-size:12px;color:var(--muted)}
    .modal-close{background:transparent;border:1px solid var(--border);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--near-black);transition:all .2s;flex-shrink:0}
    .modal-close:hover{background:var(--shell);border-color:var(--bordeaux)}
    
    .modal-body{padding:24px 32px 28px}
    
    .modal-section{margin-bottom:24px}
    .modal-section:last-child{margin-bottom:0}
    .modal-section-h{font-family:'Manrope',sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--deep-gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .modal-section-h::before{content:'';width:16px;height:1px;background:var(--gold)}
    
    .modal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .modal-field{background:var(--shell);border-radius:8px;padding:10px 14px}
    .modal-field.full{grid-column:1 / -1}
    .modal-field-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
    .modal-field-value{font-size:13px;color:var(--near-black);font-weight:500;word-break:break-word}
    .modal-field-value a{color:var(--bordeaux);text-decoration:none}
    .modal-field-value a:hover{text-decoration:underline}
    .modal-field-value.muted{color:var(--muted);font-style:italic}
    
    .modal-message{background:var(--shell);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:14px 18px;font-size:13.5px;color:var(--near-black);line-height:1.6;white-space:pre-wrap}
    
    .modal-actions{padding:18px 32px;background:var(--shell);border-top:1px solid var(--border);border-radius:0 0 14px 14px;display:flex;gap:10px;flex-wrap:wrap}
    .modal-actions .btn-primary{background:var(--bordeaux);color:var(--gold);border:none;padding:10px 18px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .modal-actions .btn-primary:hover{background:var(--near-black)}
    .modal-actions .btn-secondary{background:transparent;color:var(--near-black);border:1px solid var(--border);padding:10px 18px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .modal-actions .btn-secondary:hover{background:var(--shell);border-color:var(--bordeaux)}
    
    /* Status Editor */
    .status-editor{display:flex;gap:10px;align-items:center}
    .status-select{flex:1;padding:11px 14px;font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--near-black);outline:none;cursor:pointer;transition:all .2s}
    .status-select:focus{border-color:var(--bordeaux);box-shadow:0 0 0 3px rgba(66,29,29,.08)}
    .status-save-btn{padding:11px 18px;background:var(--bordeaux);color:var(--gold);border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:all .2s;white-space:nowrap}
    .status-save-btn:hover{background:var(--near-black)}
    .status-save-btn:disabled{opacity:.6;cursor:not-allowed}
    .status-msg{margin-top:10px;font-size:12px;display:none}
    .status-msg.success{display:block;color:var(--green)}
    .status-msg.error{display:block;color:var(--red)}
    
    @media(max-width:900px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .table-search{width:160px}
      th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="/dashboard.html" class="brand">
      <img src="/assets/logos/logo-gold.png" alt="UCB">
      <div>
        <div class="brand-text">UCB Repetitorium</div>
        <div class="brand-subtext">Admin-Bereich</div>
      </div>
    </a>
    <div class="topbar-right">
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" data-tab="bookings">
      Buchungen
      <span class="tab-count" id="bookingsCount">–</span>
    </button>
    <button class="tab" data-tab="leads">
      Anfragen
      <span class="tab-count" id="leadsCount">–</span>
    </button>
  </div>
</div>

<div class="main">
  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Buchungen total</div>
      <div class="stat-value" id="statTotalBookings">–</div>
      <div class="stat-sub">Erfolgreich bezahlt</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Umsatz</div>
      <div class="stat-value" id="statRevenue">–</div>
      <div class="stat-sub">Aus erfolgreichen Buchungen</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Offene Anfragen</div>
      <div class="stat-value" id="statOpenLeads">–</div>
      <div class="stat-sub">Noch nicht kontaktiert</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Diese Woche</div>
      <div class="stat-value" id="statThisWeek">–</div>
      <div class="stat-sub">Buchungen + Anfragen</div>
    </div>
  </div>

  <!-- BOOKINGS TAB -->
  <div class="tab-content active" id="tab-bookings">
    <div class="table-wrap">
      <div class="table-head">
        <div class="table-title">Buchungen</div>
        <input class="table-search" id="bookingSearch" placeholder="Suchen nach Name, E-Mail, Uni...">
      </div>
      <div id="bookingsTable">
        <div class="empty">Lade Buchungen...</div>
      </div>
    </div>
  </div>

  <!-- LEADS TAB -->
  <div class="tab-content" id="tab-leads">
    <div class="table-wrap">
      <div class="table-head">
        <div class="table-title">Anfragen</div>
        <input class="table-search" id="leadSearch" placeholder="Suchen nach Name, E-Mail, Uni...">
      </div>
      <div id="leadsTable">
        <div class="empty">Lade Anfragen...</div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title-block">
        <div class="modal-pre" id="modalPre">— Details</div>
        <div class="modal-title" id="modalTitle">Name</div>
        <div class="modal-sub" id="modalSub">Meta</div>
      </div>
      <button class="modal-close" onclick="closeDetail()" aria-label="Schließen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
// === Tab Switching ===
async function logout() {
  await fetch('/api/auth', { method: 'DELETE' });
  window.location.href = '/';
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`tab-${target}`).classList.add('active');
  });
});

// === Load Data ===
let bookings = [];
let leads = [];

async function loadAll() {
  try {
    const [bRes, lRes] = await Promise.all([
      fetch('/api/bookings').then(r => r.json()),
      fetch('/api/leads').then(r => r.json()),
    ]);
    
    // Show errors visibly
    const errors = [];
    if (bRes.error === 'Unauthorized' || lRes.error === 'Unauthorized') {
      window.location.href = '/';
      return;
    }
    if (bRes.error) errors.push('Bookings: ' + bRes.error);
    if (lRes.error) errors.push('Leads: ' + lRes.error);
    
    if (errors.length) {
      const errBox = document.getElementById('errorBanner') || (() => {
        const box = document.createElement('div');
        box.id = 'errorBanner';
        box.style.cssText = 'background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:14px 20px;margin:0 0 20px;border-radius:8px;font-size:13px;line-height:1.6';
        document.querySelector('.main').insertBefore(box, document.querySelector('.stats'));
        return box;
      })();
      errBox.innerHTML = '<strong>⚠️ Fehler beim Laden der Daten:</strong><br>' + errors.join('<br>') + '<br><br><a href="/api/debug" target="_blank" style="color:#991B1B;text-decoration:underline">Debug-Info anzeigen →</a>';
    } else {
      const existing = document.getElementById('errorBanner');
      if (existing) existing.remove();
    }
    
    bookings = bRes.records || [];
    leads = lRes.records || [];
    renderStats();
    renderBookings();
    renderLeads();
  } catch (e) {
    console.error('Load error:', e);
    alert('Fehler beim Laden: ' + e.message + '\n\nÖffne /api/debug für Details.');
  }
}

function renderStats() {
  const paid = bookings.filter(b => b.Status === 'paid');
  const revenue = paid.reduce((sum, b) => sum + (b.Amount_Paid || 1290), 0);
  const openLeads = leads.filter(l => l.Status === 'new').length;
  const oneWeekAgo = Date.now() - 7*24*60*60*1000;
  const thisWeek = [...bookings, ...leads].filter(r => new Date(r.Created_At).getTime() > oneWeekAgo).length;
  
  document.getElementById('statTotalBookings').textContent = paid.length;
  document.getElementById('statRevenue').textContent = revenue.toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  document.getElementById('statOpenLeads').textContent = openLeads;
  document.getElementById('statThisWeek').textContent = thisWeek;
  document.getElementById('bookingsCount').textContent = bookings.length;
  document.getElementById('leadsCount').textContent = leads.length;
}

function renderBookings(filter = '') {
  const filtered = bookings.filter(b => {
    if (!filter) return true;
    const q = filter.toLowerCase();
    return [b.Vorname, b.Nachname, b.Email, b.Uni].some(v => String(v||'').toLowerCase().includes(q));
  });
  
  const container = document.getElementById('bookingsTable');
  if (!filtered.length) {
    container.innerHTML = '<div class="empty">Keine Buchungen gefunden.</div>';
    return;
  }
  
  container.innerHTML = `
    <table>
      <thead>
        <tr><th>Name</th><th>Status</th><th>Datum</th><th>Uni</th><th></th></tr>
      </thead>
      <tbody>
        ${filtered.map(b => `
          <tr class="clickable-row" data-type="booking" data-id="${b.id}">
            <td>
              <div class="name">${escapeHtml(b.Vorname)} ${escapeHtml(b.Nachname)}</div>
              <a class="email" href="mailto:${b.Email}" onclick="event.stopPropagation()">${escapeHtml(b.Email)}</a>
            </td>
            <td><span class="status status-${b.Status}">${statusLabel(b.Status)}</span></td>
            <td>${formatDate(b.Created_At)}</td>
            <td>${escapeHtml(b.Uni || '—')}</td>
            <td>
              <div class="actions" onclick="event.stopPropagation()">
                ${b.Invoice_Url ? `<a class="action-btn" href="${b.Invoice_Url}" target="_blank">Rechnung</a>` : ''}
                <a class="action-btn" href="mailto:${b.Email}">Mailen</a>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  
  // Click handler
  container.querySelectorAll('.clickable-row').forEach(row => {
    row.addEventListener('click', () => {
      showDetail(row.dataset.type, row.dataset.id);
    });
  });
}

function renderLeads(filter = '') {
  const filtered = leads.filter(l => {
    if (!filter) return true;
    const q = filter.toLowerCase();
    return [l.Vorname, l.Nachname, l.Email, l.Uni].some(v => String(v||'').toLowerCase().includes(q));
  });
  
  const container = document.getElementById('leadsTable');
  if (!filtered.length) {
    container.innerHTML = '<div class="empty">Keine Anfragen gefunden.</div>';
    return;
  }
  
  const examenLabel = { '1_staatsexamen': '1. Examen', '2_staatsexamen': '2. Examen' };
  
  container.innerHTML = `
    <table>
      <thead>
        <tr><th>Name</th><th>Status</th><th>Datum</th><th>Examen</th><th></th></tr>
      </thead>
      <tbody>
        ${filtered.map(l => `
          <tr class="clickable-row" data-type="lead" data-id="${l.id}">
            <td>
              <div class="name">${escapeHtml(l.Vorname)} ${escapeHtml(l.Nachname)}</div>
              <a class="email" href="mailto:${l.Email}" onclick="event.stopPropagation()">${escapeHtml(l.Email)}</a>
              ${l.Nachricht ? `<div class="meta">"${escapeHtml(l.Nachricht.substring(0,80))}${l.Nachricht.length > 80 ? '...' : ''}"</div>` : ''}
            </td>
            <td><span class="status status-${l.Status}">${statusLabel(l.Status)}</span></td>
            <td>${formatDate(l.Created_At)}</td>
            <td>${examenLabel[l.Examen] || l.Examen}</td>
            <td>
              <div class="actions" onclick="event.stopPropagation()">
                <a class="action-btn" href="mailto:${l.Email}?subject=Deine%20Anfrage%20zum%20UCB%20Repetitorium">Antworten</a>
                <button class="action-btn" onclick="markContacted('${l.id}')">Kontaktiert</button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  
  // Click handler
  container.querySelectorAll('.clickable-row').forEach(row => {
    row.addEventListener('click', () => {
      showDetail(row.dataset.type, row.dataset.id);
    });
  });
}

async function markContacted(leadId) {
  try {
    await fetch(`/api/leads/${leadId}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ Status: 'contacted' })
    });
    loadAll();
  } catch (e) {
    alert('Fehler beim Update: ' + e.message);
  }
}

// === Manual Status Update (from modal dropdown) ===
async function updateStatus(type, id) {
  const select = document.getElementById('statusSelect');
  const msg = document.getElementById('statusMsg');
  const btn = document.querySelector('.status-save-btn');
  if (!select) return;
  
  const newStatus = select.value;
  msg.className = 'status-msg';
  btn.disabled = true;
  btn.textContent = 'Speichert...';
  
  const endpoint = type === 'booking' ? `/api/bookings/${id}` : `/api/leads/${id}`;
  
  try {
    const res = await fetch(endpoint, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ Status: newStatus })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Fehler beim Speichern');
    
    msg.textContent = '✓ Status gespeichert';
    msg.className = 'status-msg success';
    
    // Refresh data in background, update local item
    await loadAll();
    
    btn.disabled = false;
    btn.textContent = 'Status speichern';
  } catch (e) {
    msg.textContent = 'Fehler: ' + e.message;
    msg.className = 'status-msg error';
    btn.disabled = false;
    btn.textContent = 'Status speichern';
  }
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('de-DE', { day:'2-digit', month:'short', year:'2-digit' });
}
function statusLabel(s) {
  return {
    paid:'Bezahlt', pending:'Ausstehend', unpaid:'Nicht bezahlt', expired:'Abgelaufen', refunded:'Erstattet',
    new:'Neu', contacted:'Kontaktiert', booked:'Gebucht', closed:'Abgeschlossen'
  }[s] || s;
}

// Search
document.getElementById('bookingSearch').addEventListener('input', e => renderBookings(e.target.value));
document.getElementById('leadSearch').addEventListener('input', e => renderLeads(e.target.value));

// === Detail Modal ===
function showDetail(type, id) {
  const item = type === 'booking' 
    ? bookings.find(b => b.id === id)
    : leads.find(l => l.id === id);
  if (!item) return;
  
  const examenLabel = { 
    '1_staatsexamen': 'Erstes Juristisches Staatsexamen', 
    '2_staatsexamen': 'Zweites Juristisches Staatsexamen' 
  };
  
  document.getElementById('modalPre').textContent = type === 'booking' ? '— Buchung' : '— Anfrage';
  document.getElementById('modalTitle').textContent = `${item.Vorname || ''} ${item.Nachname || ''}`.trim() || '—';
  
  const status = statusLabel(item.Status);
  const subBits = [
    `<span class="status status-${item.Status}">${status}</span>`,
    `ID: ${(item.id || '').substring(0, 10).toUpperCase()}`,
    formatDate(item.Created_At),
  ];
  document.getElementById('modalSub').innerHTML = subBits.join(' · ');
  
  let bodyHtml = '';
  
  if (type === 'booking') {
    // === BOOKING DETAILS ===
    bodyHtml = `
      <div class="modal-section">
        <div class="modal-section-h">Kontakt</div>
        <div class="modal-grid">
          ${field('Vorname', item.Vorname)}
          ${field('Nachname', item.Nachname)}
          ${field('E-Mail', item.Email, 'email')}
          ${field('Telefon', item.Telefon, 'phone')}
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-h">Studium &amp; Examen</div>
        <div class="modal-grid">
          ${field('Universität', item.Uni, null, true)}
          ${item.Kurs ? field('Kurs', item.Kurs, null, true) : ''}
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-h">Rechnungsadresse</div>
        <div class="modal-grid">
          ${field('Adresse', item.Adresse, null, true)}
          ${field('PLZ', item.PLZ)}
          ${field('Stadt', item.Stadt)}
          ${field('Land', item.Land)}
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-h">Zahlung</div>
        <div class="modal-grid">
          ${field('Betrag', item.Amount_Paid ? formatCurrency(item.Amount_Paid) : '1.290,00 €')}
          ${field('Newsletter', item.Newsletter ? 'Ja' : 'Nein')}
          ${field('Bezahlt am', formatDate(item.Paid_At))}
          ${item.Stripe_Payment_Intent ? field('Stripe Payment', item.Stripe_Payment_Intent.substring(0, 24) + '…') : ''}
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-h">Status ändern</div>
        <div class="status-editor">
          <select id="statusSelect" class="status-select">
            <option value="pending"${item.Status === 'pending' ? ' selected' : ''}>Ausstehend</option>
            <option value="paid"${item.Status === 'paid' ? ' selected' : ''}>Bezahlt</option>
            <option value="unpaid"${item.Status === 'unpaid' ? ' selected' : ''}>Nicht bezahlt</option>
            <option value="expired"${item.Status === 'expired' ? ' selected' : ''}>Abgelaufen</option>
            <option value="refunded"${item.Status === 'refunded' ? ' selected' : ''}>Erstattet</option>
          </select>
          <button class="status-save-btn" onclick="updateStatus('booking', '${item.id}')">Status speichern</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
      </div>
    `;
  } else {
    // === LEAD DETAILS ===
    bodyHtml = `
      <div class="modal-section">
        <div class="modal-section-h">Kontakt</div>
        <div class="modal-grid">
          ${field('Vorname', item.Vorname)}
          ${field('Nachname', item.Nachname)}
          ${field('E-Mail', item.Email, 'email')}
          ${field('Telefon', item.Telefon, 'phone')}
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-h">Studium &amp; Examen</div>
        <div class="modal-grid">
          ${field('Examen', examenLabel[item.Examen] || item.Examen, null, true)}
          ${field('Universität', item.Uni, null, true)}
        </div>
      </div>

      ${item.Nachricht ? `
        <div class="modal-section">
          <div class="modal-section-h">Nachricht</div>
          <div class="modal-message">${escapeHtml(item.Nachricht)}</div>
        </div>
      ` : ''}

      ${item.Internal_Notes ? `
        <div class="modal-section">
          <div class="modal-section-h">Interne Notizen</div>
          <div class="modal-message">${escapeHtml(item.Internal_Notes)}</div>
        </div>
      ` : ''}

      <div class="modal-section">
        <div class="modal-section-h">Status</div>
        <div class="modal-grid">
          ${field('Anfrage eingegangen', formatDate(item.Created_At))}
          ${item.Contacted_At ? field('Kontaktiert', formatDate(item.Contacted_At)) : field('Kontaktiert', 'Noch nicht')}
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-h">Status ändern</div>
        <div class="status-editor">
          <select id="statusSelect" class="status-select">
            <option value="new"${item.Status === 'new' ? ' selected' : ''}>Neu</option>
            <option value="contacted"${item.Status === 'contacted' ? ' selected' : ''}>Kontaktiert</option>
            <option value="booked"${item.Status === 'booked' ? ' selected' : ''}>Gebucht</option>
            <option value="closed"${item.Status === 'closed' ? ' selected' : ''}>Abgeschlossen</option>
          </select>
          <button class="status-save-btn" onclick="updateStatus('lead', '${item.id}')">Status speichern</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
      </div>
    `;
  }
  
  document.getElementById('modalBody').innerHTML = bodyHtml;
  
  // Action buttons
  let actions = `
    <a class="btn-primary" href="mailto:${item.Email}?subject=${encodeURIComponent('Deine ' + (type === 'booking' ? 'Buchung' : 'Anfrage') + ' beim UCB Repetitorium')}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      E-Mail schreiben
    </a>
  `;
  if (item.Telefon) {
    actions += `<a class="btn-secondary" href="tel:${item.Telefon}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Anrufen
    </a>`;
  }
  if (type === 'booking' && item.Invoice_Url) {
    actions += `<a class="btn-secondary" href="${item.Invoice_Url}" target="_blank">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Rechnung
    </a>`;
  }
  if (type === 'lead' && item.Status === 'new') {
    actions += `<button class="btn-secondary" onclick="markContacted('${item.id}'); closeDetail();">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Als kontaktiert markieren
    </button>`;
  }
  
  document.getElementById('modalActions').innerHTML = actions;
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// Close on overlay click or ESC
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeDetail();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

function field(label, value, type, fullWidth) {
  if (!value || value === '—' || value === '') {
    return `<div class="modal-field${fullWidth ? ' full' : ''}">
      <div class="modal-field-label">${escapeHtml(label)}</div>
      <div class="modal-field-value muted">Nicht angegeben</div>
    </div>`;
  }
  let display = escapeHtml(String(value));
  if (type === 'email') display = `<a href="mailto:${value}">${display}</a>`;
  if (type === 'phone') display = `<a href="tel:${value}">${display}</a>`;
  return `<div class="modal-field${fullWidth ? ' full' : ''}">
    <div class="modal-field-label">${escapeHtml(label)}</div>
    <div class="modal-field-value">${display}</div>
  </div>`;
}

function formatCurrency(amount) {
  return Number(amount).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
}

// === Auto-refresh every 60s ===
loadAll();
setInterval(loadAll, 60000);
</script>
