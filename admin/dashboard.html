<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCB Admin · Dashboard</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bordeaux:#421D1D;
      --gold:#F0B66B;
      --deep-gold:#B8853E;
      --shell:#F8F4EE;
      --near-black:#1A1A1A;
      --muted:#7A6E64;
      --border:#E5DDD0;
      --green:#16A34A;
      --orange:#EA580C;
      --red:#DC2626;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:var(--shell);color:var(--near-black);font-size:14px}
    
    /* Topbar */
    .topbar{background:var(--near-black);color:#fff;padding:14px 0;border-bottom:3px solid var(--gold)}
    .topbar-inner{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center}
    .brand{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
    .topbar-right{display:flex;align-items:center;gap:14px;font-size:12px;color:rgba(255,255,255,.7)}
    .logout-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:all .2s}
    .logout-btn:hover{background:rgba(255,255,255,.1);color:#fff}
    
    /* Tabs */
    .tabs-wrap{background:#fff;border-bottom:1px solid var(--border)}
    .tabs{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;gap:8px}
    .tab{padding:14px 18px;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:8px}
    .tab:hover{color:var(--near-black)}
    .tab.active{color:var(--bordeaux);border-bottom-color:var(--bordeaux)}
    .tab-count{background:var(--shell);color:var(--near-black);padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:700}
    .tab.active .tab-count{background:var(--gold);color:var(--bordeaux)}
    
    /* Main */
    .main{max-width:1280px;margin:0 auto;padding:24px}
    
    /* Stats */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px}
    .stat-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--deep-gold);margin-bottom:6px}
    .stat-value{font-size:24px;font-weight:800;color:var(--near-black);letter-spacing:-.01em}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:2px}
    
    /* Table */
    .table-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .table-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
    .table-title{font-size:13px;font-weight:700;color:var(--near-black);text-transform:uppercase;letter-spacing:.05em}
    .table-search{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;outline:none;width:240px}
    .table-search:focus{border-color:var(--bordeaux)}
    
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:11px 20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--shell);border-bottom:1px solid var(--border)}
    td{padding:14px 20px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#FAFAF8}
    
    .name{font-weight:700;color:var(--near-black)}
    .meta{font-size:11.5px;color:var(--muted);margin-top:1px}
    .email{color:var(--bordeaux);text-decoration:none;font-size:12.5px}
    .email:hover{text-decoration:underline}
    
    .status{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .status::before{content:'';width:5px;height:5px;border-radius:50%}
    .status-paid{background:rgba(22,163,74,.1);color:var(--green)}
    .status-paid::before{background:var(--green)}
    .status-pending{background:rgba(234,88,12,.1);color:var(--orange)}
    .status-pending::before{background:var(--orange)}
    .status-new{background:rgba(240,182,107,.15);color:var(--deep-gold)}
    .status-new::before{background:var(--gold)}
    .status-contacted{background:rgba(66,29,29,.08);color:var(--bordeaux)}
    .status-contacted::before{background:var(--bordeaux)}
    .status-expired{background:rgba(220,38,38,.08);color:var(--red)}
    .status-expired::before{background:var(--red)}
    
    .actions{display:flex;gap:6px}
    .action-btn{padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:5px;font-size:11px;font-weight:600;color:var(--near-black);cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
    .action-btn:hover{background:var(--bordeaux);color:var(--gold);border-color:var(--bordeaux)}
    
    /* Hidden by default */
    .tab-content{display:none}
    .tab-content.active{display:block}
    
    .empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px}
    
    @media(max-width:900px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .table-search{width:160px}
      th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">UCB Admin</div>
    <div class="topbar-right">
      <a href="/" class="logout-btn" style="text-decoration:none;display:inline-block">Zur Startseite</a>
    </div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" data-tab="bookings">
      Buchungen
      <span class="tab-count" id="bookingsCount">–</span>
    </button>
    <button class="tab" data-tab="leads">
      Anfragen
      <span class="tab-count" id="leadsCount">–</span>
    </button>
  </div>
</div>

<div class="main">
  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Buchungen total</div>
      <div class="stat-value" id="statTotalBookings">–</div>
      <div class="stat-sub">Erfolgreich bezahlt</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Umsatz</div>
      <div class="stat-value" id="statRevenue">–</div>
      <div class="stat-sub">Aus erfolgreichen Buchungen</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Offene Anfragen</div>
      <div class="stat-value" id="statOpenLeads">–</div>
      <div class="stat-sub">Noch nicht kontaktiert</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Diese Woche</div>
      <div class="stat-value" id="statThisWeek">–</div>
      <div class="stat-sub">Buchungen + Anfragen</div>
    </div>
  </div>

  <!-- BOOKINGS TAB -->
  <div class="tab-content active" id="tab-bookings">
    <div class="table-wrap">
      <div class="table-head">
        <div class="table-title">Buchungen</div>
        <input class="table-search" id="bookingSearch" placeholder="Suchen nach Name, E-Mail, Uni...">
      </div>
      <div id="bookingsTable">
        <div class="empty">Lade Buchungen...</div>
      </div>
    </div>
  </div>

  <!-- LEADS TAB -->
  <div class="tab-content" id="tab-leads">
    <div class="table-wrap">
      <div class="table-head">
        <div class="table-title">Anfragen</div>
        <input class="table-search" id="leadSearch" placeholder="Suchen nach Name, E-Mail, Uni...">
      </div>
      <div id="leadsTable">
        <div class="empty">Lade Anfragen...</div>
      </div>
    </div>
  </div>
</div>

<script>
// === Tab Switching ===
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`tab-${target}`).classList.add('active');
  });
});

// === Load Data ===
let bookings = [];
let leads = [];

async function loadAll() {
  try {
    const [bRes, lRes] = await Promise.all([
      fetch('/api/bookings').then(r => r.json()),
      fetch('/api/leads').then(r => r.json()),
    ]);
    
    // Show errors visibly
    const errors = [];
    if (bRes.error) errors.push('Bookings: ' + bRes.error);
    if (lRes.error) errors.push('Leads: ' + lRes.error);
    
    if (errors.length) {
      const errBox = document.getElementById('errorBanner') || (() => {
        const box = document.createElement('div');
        box.id = 'errorBanner';
        box.style.cssText = 'background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:14px 20px;margin:0 0 20px;border-radius:8px;font-size:13px;line-height:1.6';
        document.querySelector('.main').insertBefore(box, document.querySelector('.stats'));
        return box;
      })();
      errBox.innerHTML = '<strong>⚠️ Fehler beim Laden der Daten:</strong><br>' + errors.join('<br>') + '<br><br><a href="/api/debug" target="_blank" style="color:#991B1B;text-decoration:underline">Debug-Info anzeigen →</a>';
    } else {
      const existing = document.getElementById('errorBanner');
      if (existing) existing.remove();
    }
    
    bookings = bRes.records || [];
    leads = lRes.records || [];
    renderStats();
    renderBookings();
    renderLeads();
  } catch (e) {
    console.error('Load error:', e);
    alert('Fehler beim Laden: ' + e.message + '\n\nÖffne /api/debug für Details.');
  }
}

function renderStats() {
  const paid = bookings.filter(b => b.Status === 'paid');
  const revenue = paid.reduce((sum, b) => sum + (b.Amount_Paid || 1290), 0);
  const openLeads = leads.filter(l => l.Status === 'new').length;
  const oneWeekAgo = Date.now() - 7*24*60*60*1000;
  const thisWeek = [...bookings, ...leads].filter(r => new Date(r.Created_At).getTime() > oneWeekAgo).length;
  
  document.getElementById('statTotalBookings').textContent = paid.length;
  document.getElementById('statRevenue').textContent = revenue.toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  document.getElementById('statOpenLeads').textContent = openLeads;
  document.getElementById('statThisWeek').textContent = thisWeek;
  document.getElementById('bookingsCount').textContent = bookings.length;
  document.getElementById('leadsCount').textContent = leads.length;
}

function renderBookings(filter = '') {
  const filtered = bookings.filter(b => {
    if (!filter) return true;
    const q = filter.toLowerCase();
    return [b.Vorname, b.Nachname, b.Email, b.Uni].some(v => String(v||'').toLowerCase().includes(q));
  });
  
  const container = document.getElementById('bookingsTable');
  if (!filtered.length) {
    container.innerHTML = '<div class="empty">Keine Buchungen gefunden.</div>';
    return;
  }
  
  container.innerHTML = `
    <table>
      <thead>
        <tr><th>Name</th><th>Status</th><th>Datum</th><th>Uni</th><th>Stand</th><th></th></tr>
      </thead>
      <tbody>
        ${filtered.map(b => `
          <tr>
            <td>
              <div class="name">${escapeHtml(b.Vorname)} ${escapeHtml(b.Nachname)}</div>
              <a class="email" href="mailto:${b.Email}">${escapeHtml(b.Email)}</a>
            </td>
            <td><span class="status status-${b.Status}">${statusLabel(b.Status)}</span></td>
            <td>${formatDate(b.Created_At)}</td>
            <td>${escapeHtml(b.Uni || '—')}</td>
            <td><div class="meta">${escapeHtml(b.Stand || '—')}</div></td>
            <td>
              <div class="actions">
                ${b.Invoice_Url ? `<a class="action-btn" href="${b.Invoice_Url}" target="_blank">Rechnung</a>` : ''}
                <a class="action-btn" href="mailto:${b.Email}">Mailen</a>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderLeads(filter = '') {
  const filtered = leads.filter(l => {
    if (!filter) return true;
    const q = filter.toLowerCase();
    return [l.Vorname, l.Nachname, l.Email, l.Uni].some(v => String(v||'').toLowerCase().includes(q));
  });
  
  const container = document.getElementById('leadsTable');
  if (!filtered.length) {
    container.innerHTML = '<div class="empty">Keine Anfragen gefunden.</div>';
    return;
  }
  
  const examenLabel = { '1_staatsexamen': '1. Examen', '2_staatsexamen': '2. Examen' };
  
  container.innerHTML = `
    <table>
      <thead>
        <tr><th>Name</th><th>Status</th><th>Datum</th><th>Examen</th><th>Stand</th><th></th></tr>
      </thead>
      <tbody>
        ${filtered.map(l => `
          <tr>
            <td>
              <div class="name">${escapeHtml(l.Vorname)} ${escapeHtml(l.Nachname)}</div>
              <a class="email" href="mailto:${l.Email}">${escapeHtml(l.Email)}</a>
              ${l.Nachricht ? `<div class="meta">"${escapeHtml(l.Nachricht.substring(0,80))}${l.Nachricht.length > 80 ? '...' : ''}"</div>` : ''}
            </td>
            <td><span class="status status-${l.Status}">${statusLabel(l.Status)}</span></td>
            <td>${formatDate(l.Created_At)}</td>
            <td>${examenLabel[l.Examen] || l.Examen}</td>
            <td><div class="meta">${escapeHtml(l.Stand || '—')}</div></td>
            <td>
              <div class="actions">
                <a class="action-btn" href="mailto:${l.Email}?subject=Deine%20Anfrage%20zum%20UCB%20Repetitorium">Antworten</a>
                <button class="action-btn" onclick="markContacted('${l.id}')">Kontaktiert</button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function markContacted(leadId) {
  try {
    await fetch(`/api/leads/${leadId}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ Status: 'contacted' })
    });
    loadAll();
  } catch (e) {
    alert('Fehler beim Update: ' + e.message);
  }
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('de-DE', { day:'2-digit', month:'short', year:'2-digit' });
}
function statusLabel(s) {
  return {paid:'Bezahlt',pending:'Ausstehend',new:'Neu',contacted:'Kontaktiert',expired:'Abgelaufen'}[s] || s;
}

// Search
document.getElementById('bookingSearch').addEventListener('input', e => renderBookings(e.target.value));
document.getElementById('leadSearch').addEventListener('input', e => renderLeads(e.target.value));

// Auto-refresh every 60s
loadAll();
setInterval(loadAll, 60000);
</script>

</body>
</html>
